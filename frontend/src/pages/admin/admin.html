<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — PlayRent</title>
  <link rel="stylesheet" href="../../styles/globals.css">
</head>
<body>
<div class="dash-wrap">
  <aside class="dash-side">
    <h5>Admin Portal</h5>
    <nav class="dash-nav">
      <a href="admin.html" class="active">📈 Analytics</a>
      <a href="../staff/staff.html">📋 All rentals</a>
      <a href="../catalog/catalog.html">🛍️ Catalog</a>
      <a href="#" id="signOut">🚪 Sign out</a>
    </nav>
  </aside>
  <main class="dash-main">
    <div class="dash-head">
      <div><h1>Analytics</h1><p>Platform-wide performance overview.</p></div>
    </div>
    <div class="stats-row" id="stats"></div>
    <div id="charts" style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:8px"></div>
  </main>
</div>

<script>var ROOT = "../../../";</script>
<script src="../../config/env.js"></script>
<script src="../../utils/constants.js"></script>
<script src="../../utils/helpers.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/apiClient.js"></script>
<script src="../../components/layout/header.js"></script>
<script>
  mountNav("admin");
  var u = session.require("ADMIN");
  if (u) {
    document.getElementById("signOut").onclick = function() { session.clear(); location.href = ROOT+"index.html"; };

    Promise.all([api.listRentals(), api.listEquipment()]).then(function(res) {
      var rentals = res[0], equip = res[1];
      var revenue = rentals.filter(function(r){return r.status!=="REJECTED";})
                            .reduce(function(s,r){return s+(r.total||0);}, 0);
      var stock   = equip.reduce(function(s,e){return s+(e.stock||0);}, 0);

      document.getElementById("stats").innerHTML =
        '<div class="stat-card"><div class="s-lbl">Revenue</div><div class="s-val">$'+revenue+'</div><div class="s-note">All time</div></div>' +
        '<div class="stat-card"><div class="s-lbl">Rentals</div><div class="s-val">'+rentals.length+'</div></div>' +
        '<div class="stat-card"><div class="s-lbl">Stock units</div><div class="s-val">'+stock+'</div></div>' +
        '<div class="stat-card"><div class="s-lbl">SKUs</div><div class="s-val">'+equip.length+'</div></div>';

      // Revenue by sport
      var bySport = {};
      for (var i=0; i<rentals.length; i++) {
        var rental = rentals[i];
        var eq = null;
        for (var j=0; j<equip.length; j++) { if (String(equip[j].id)===String(rental.equipmentId)){eq=equip[j];break;} }
        if (eq) bySport[eq.sport] = (bySport[eq.sport]||0) + (rental.total||0);
      }
      var sports = Object.keys(bySport);
      var maxRev = 1;
      for (var k=0; k<sports.length; k++) { if (bySport[sports[k]]>maxRev) maxRev=bySport[sports[k]]; }

      var barHTML = sports.length ? "" : '<p style="color:#9ca3af">No revenue yet.</p>';
      for (var m=0; m<sports.length; m++) {
        var sp=sports[m], val=bySport[sp], pct=Math.round(val/maxRev*100);
        barHTML += '<div class="bar-row">' +
          '<div class="bar-lbl"><span>'+sp+'</span><strong>$'+val+'</strong></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
      }

      // Low stock
      var low = equip.filter(function(e){ return e.stock < 6; });
      var lowHTML = low.length ? "" : '<p style="padding:14px 22px;color:#9ca3af">All stock healthy.</p>';
      for (var n=0; n<low.length; n++) {
        var it=low[n];
        lowHTML += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 22px;border-bottom:1px solid #f3f4f6">' +
          '<span>'+(it.emoji||"")+" "+it.name+'</span>' +
          '<span class="badge '+(it.stock<3?"badge-red":"badge-yellow")+'">'+it.stock+' left</span></div>';
      }

      document.getElementById("charts").innerHTML =
        '<div class="table-card"><div class="tc-head"><h3>Revenue by sport</h3></div><div style="padding:22px">'+barHTML+'</div></div>' +
        '<div class="table-card"><div class="tc-head"><h3>Low stock alerts</h3></div>'+lowHTML+'</div>';
    });
  }
</script>
</body>
</html>
