<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account — PlayRent</title>
  <link rel="stylesheet" href="../../styles/globals.css">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <h1>Get started.</h1>
    <p class="auth-sub">Create your free PlayRent account.</p>
    <div class="field"><label>Full name</label><input type="text" id="name" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input type="password" id="pw" placeholder="Min 6 characters"></div>
    <button class="btn btn-primary btn-block btn-lg" id="regBtn">Create account →</button>
    <p class="auth-foot">Already have one? <a href="login.html">Sign in</a></p>
  </div>
</main>

<script>var ROOT = "../../../";</script>
<script src="../../config/env.js"></script>
<script src="../../utils/constants.js"></script>
<script src="../../utils/helpers.js"></script>
<script src="../../services/authService.js"></script>
<script src="../../services/apiClient.js"></script>
<script src="../../components/layout/header.js"></script>
<script>
  mountNav();

  document.getElementById("regBtn").onclick = function() {
    var name  = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var pw    = document.getElementById("pw").value;
    if (!name||!email||!pw) { toast("Please fill in all fields","error"); return; }
    if (pw.length < 6)      { toast("Password must be at least 6 characters","error"); return; }

    api.register(name, email, pw).then(function(r) {
      session.set(r.token, r.user);
      toast("Welcome to PlayRent!");
      setTimeout(function() { location.href = ROOT + "src/pages/dashboard/dashboard.html"; }, 600);
    }).catch(function(e) { toast(e.message,"error"); });
  };
</script>
</body>
</html>
